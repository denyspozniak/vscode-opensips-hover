name: publish

# Tag v0.2.0 -> builds the .vsix, publishes to both registries.
# VS Code Marketplace: VSCE_PAT (Azure DevOps PAT, Marketplace > Manage scope)
# Open VSX (this is what Cursor/Windsurf/VSCodium read): OVSX_PAT
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run compile

      # Both registries reject a re-publish of an existing version, so catch a
      # stale package.json before we burn the tag.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          [ "$tag" = "$pkg" ] || { echo "tag v$tag != package.json $pkg"; exit 1; }

      - name: Package
        run: npx vsce package --out opensips-hover.vsix

      # Open VSX first: this is the registry Cursor reads, so a missing/expired
      # VSCE_PAT must never block it.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx ovsx publish opensips-hover.vsix -p "$OVSX_PAT"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath opensips-hover.vsix

      - name: Attach .vsix to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: opensips-hover.vsix
