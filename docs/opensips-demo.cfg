#!OPENSIPS
#
# Neutral sample used for the README screenshot and for eyeballing the hovers.
# Not a working config -- every construct here exists only to have something to
# point at. Named opensips-*.cfg on purpose, so the language id resolves to
# `opensips` even when a workspace maps *.cfg to kamailio.

####### Global Parameters #########

log_level = 3
udp_workers = 8
socket = udp:127.0.0.1:5060

####### Modules #########

loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "dialog.so"
loadmodule "tracer.so"

modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
modparam("dialog", "hash_size", 4096)
modparam("dialog", "default_timeout", 3600)
modparam("tracer", "trace_id", "[tid]uri=127.0.0.1:9060;transport=hep")

####### Routing #########

request_route {
	if (!mf_process_maxfwd_header("10")) {
		send_reply(483, "Too Many Hops");
		exit;
	}

	# transformations and variables
	$var(user) = $fU;
	if ($(var(user){s.len}) == 0)
		xlog("L_INFO", "no From user in $rm from $si\n");

	$avp(callee) = $(ru{uri.user});

	if (has_totag()) {
		if (loose_route()) {
			t_relay();
			exit;
		}
	}

	trace("tid", "t", "sip");

	create_dialog("B");
	set_dlg_flag(1);
	store_dlg_value("origin", "demo");

	t_on_reply("handle_reply");
	t_relay();
}

onreply_route[handle_reply] {
	xlog("L_INFO", "reply $rs for dialog $DLG_did, status $DLG_status\n");
}

local_route {
	xlog("L_INFO", "locally generated $rm\n");
}
